x-common:
    database: &db-environment
        # Do not remove the "&db-password" from the end of the line below, it is important
        # for Panel functionality.
        MYSQL_PASSWORD: &db-password 'password'
        MYSQL_ROOT_PASSWORD: &db-root-password 'rootpassword'
    panel: &panel-environment
        APP_URL: 'http://panel'
        # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
        APP_TIMEZONE: 'UTC'
        APP_SERVICE_AUTHOR: 'noreply@example.com'
        DB_USERNAME: 'pterodactyl'
        # DB_PASSWORD: "Uncomment this to user your own password"

        # Uncomment the line below and set to a non-empty value if you want to use Let's Encrypt
        # to generate an SSL certificate for the Panel.
        # LE_EMAIL: ""

    mail: &mail-environment
        MAIL_FROM: 'noreply@example.com'
        MAIL_DRIVER: 'smtp'
        MAIL_HOST: 'mailpit'
        MAIL_PORT: '1025'
        MAIL_USERNAME: ''
        MAIL_PASSWORD: ''
        MAIL_ENCRYPTION: 'true'

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#
services:
    database:
        image: mariadb:10.5
        restart: no
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - './srv/database:/var/lib/mysql'
        environment:
            <<: *db-environment
            MYSQL_DATABASE: 'panel'
            MYSQL_USER: 'pterodactyl'
        # ports:
        #     - '3306:3306'
    cache:
        image: redis:alpine
        restart: no
    panel:
        build:
            context: .
            args:
                DEV: "true"
        image: hydrodactyl:develop
        restart: no
        ports:
            - '3000:80'
            # - '443:443'
        links:
            - database
            - cache
        volumes:
            - '.:/app'
            - './srv/var:/app/var'
            - './srv/nginx/:/etc/nginx/http.d/'
            - './srv/certs:/etc/letsencrypt'
            - './srv/logs/:/app/storage/logs'
            - './srv/pterodactyl/config/:/etc/pterodactyl'
            # anonymous volumes below, meaning it'll use the image's directory instead of the host
            - '/app/vendor'
            # needed for linux permissions
            # - '/app/storage'
            # - '/app/storage/app/private'
            - '/app/storage/framework/views'
            - '/app/bootstrap/cache'
        environment:
            <<: [*panel-environment, *mail-environment]
            DB_PASSWORD: *db-password
            DB_ROOT_PASSWORD: *db-root-password
            APP_ENV: 'local'
            APP_DEBUG: 'true'
            LOG_CHANNEL: 'stack'
            LOG_LEVEL: 'debug'
            APP_ENVIRONMENT_ONLY: 'false'
            CACHE_DRIVER: 'redis'
            SESSION_DRIVER: 'redis'
            QUEUE_DRIVER: 'redis'
            REDIS_HOST: 'cache'
            DB_CONNECTION: 'mariadb'
            DB_HOST: 'database'
            DB_PORT: '3306'
            HASHIDS_LENGTH: 8
            WINGS_INTERNAL_IP: 'wings'
            WINGS_DIR: '${PWD}/srv/'
            HYDRODACTYL_DOCKER_DEV: 'true'
            MAIL_HOST: 'mailhog'
            MAIL_PORT: 1025
            MAIL_DRIVER: 'smtp'
            APP_BACKUP_DRIVER: 's3'
            AWS_DEFAULT_REGION: 'us-east-1'
            AWS_ACCESS_KEY_ID: 'garage'
            AWS_SECRET_ACCESS_KEY: 'garage'
            AWS_BACKUPS_BUCKET: 'hydrodactyl'
            AWS_ENDPOINT: 'http://garage:3900'
            AWS_USE_PATH_STYLE_ENDPOINT: 'true'

    garage:
        image: dxflrs/garage:v2.2.0
        hostname: garage
        expose:
            - '3900'
            - '3901'
            - '3903'
        volumes:
            - ./srv/garage:/var/lib/garage
            - ./srv/garage.toml:/etc/garage.toml
        environment:
            GARAGE_ADMIN_TOKEN: 'dev-admin-token'

    garage-setup:
        image: amazon/aws-cli:latest
        depends_on:
            - garage
        entrypoint: >
            /bin/sh -c "
              echo 'Waiting for Garage to be ready...'
              sleep 5
              echo 'Setup complete. Configure Garage via admin API or CLI.'
              exit 0
            "

    wings:
        image: ghcr.io/pterodactyl/wings:latest
        restart: no
        ports:
            - '8080:8080'
            - '2022:2022'
        tty: true
        environment:
            TZ: 'UTC'
            WINGS_UID: 988
            WINGS_GID: 988
            WINGS_USERNAME: pterodactyl
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock'
            - '/etc/ssl/certs:/etc/ssl/certs:ro'
            - './srv/pterodactyl/config/:/etc/pterodactyl/'

            # The volumes below need to be the exact same path in the container as on the host.
            #
            # The paths are currently hardcoded in the container on first run, meaning if you move
            # this repo on your host, you'll need to delete "srv" folder so the paths can be recreated.
            #
            # If you change these from $PWD, make sure to update `WINGS_DIR` in the panel service too.
            # Do not change anything but the $PWD part as this is also hardcoded in the container.

            - './srv/pterodactyl/tmp/:${PWD}/srv/pterodactyl/tmp/'
            - './srv/pterodactyl/docker/containers/:${PWD}/srv/pterodactyl/docker/containers/'
            - './srv/pterodactyl/:${PWD}/srv/pterodactyl/'
            - './srv/pterodactyl/logs/:${PWD}/srv/pterodactyl/logs/'


    mailpit:
        image: axllent/mailpit
        volumes:
            - ./data/mailpit/:/data
        ports:
            - '1025:1025'
            - '8025:8025'
        environment:
          MP_MAX_MESSAGES: ${MP_MAX_MESSAGES:-5000}
          MP_DATABASE: ${MP_DATABASE:-/data/mailpit.db}
          MP_SMTP_AUTH_ACCEPT_ANY: ${MP_SMTP_AUTH_ACCEPT_ANY:-1}
          MP_SMTP_AUTH_ALLOW_INSECURE: ${MP_SMTP_AUTH_ALLOW_INSECURE:-1}

networks:
    default:

volumes:
    panel_vendor:
    panel_storage:
    panel_bootstrap_cache:
    mailpit_data:
