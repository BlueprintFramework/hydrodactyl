; OPcache tuning. Laravel's vendor tree exceeds the default max_accelerated_files;
; validate_timestamps stays on so bind-mounted local development still works.
[opcache]
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
