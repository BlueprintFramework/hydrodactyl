name: Code quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on:  blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # Keep in sync with the @biomejs/biome version pinned in package.json /
      # pnpm-lock.yaml. "latest" drifts ahead of the checked-in biome.json schema
      # and starts formatting file types (YAML, Markdown) the repo does not yet
      # follow, which fails this job on untouched files.
      #
      # Upgrading Biome means bumping this pin together with package.json,
      # pnpm-lock.yaml and biome.json's $schema, then running `biome migrate`.
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15

      - name: Run Biome
        run: biome check .

