name: Code quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Biome
        run: just check-frontend
