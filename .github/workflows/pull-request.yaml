name: Code quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on:  blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # The anti-slop GritQL plugins are resolved from node_modules, so the
      # dependency tree must be present before Biome runs. Keep the pnpm
      # version in sync with package.json's `packageManager` pin.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep in sync with the @biomejs/biome version pinned in package.json /
      # pnpm-lock.yaml. "latest" drifts ahead of the checked-in biome.json schema
      # and starts formatting file types (YAML, Markdown) the repo does not yet
      # follow, which fails this job on untouched files.
      #
      # Upgrading Biome means bumping this pin together with package.json,
      # pnpm-lock.yaml and biome.json's $schema, then running `biome migrate`.
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15

      - name: Run Biome
        run: biome check .

