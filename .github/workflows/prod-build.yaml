name: Build & Push Tagged Image
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g. v6.5.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write
jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ steps.repo.outputs.repo }}:canary
            ghcr.io/${{ steps.repo.outputs.repo }}:canary-${{ github.sha }}
            ${{ !contains(env.IMAGE_TAG, '-') && format('ghcr.io/{0}:latest', steps.repo.outputs.repo) || '' }}
