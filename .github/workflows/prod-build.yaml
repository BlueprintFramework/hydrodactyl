name: Build & Push Version
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v6.4.1'
        required: true
        type: string
      update_latest:
        description: 'Also move the :latest image tag to this build'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: prod-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 1

      - name: Resolve image tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA=$(git rev-parse --short HEAD)
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$TAG"
            echo "$IMAGE:$TAG-$SHA"
            if { [ "$EVENT" = "release" ] && [ "$PRERELEASE" != "true" ]; } || [ "$UPDATE_LATEST" = "true" ]; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Older tags were cut before the version bump was committed, so make sure
      # the image always reports the version it was built for.
      - name: Stamp version into config/app.php
        run: sed -i "s/'version' => '[^']*'/'version' => '$TAG'/" config/app.php

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
