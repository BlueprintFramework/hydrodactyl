name: Build & Push Tagged Image
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write
jobs:
  build-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.repo }}:canary
            ghcr.io/${{ steps.repo.outputs.repo }}:canary-${{ github.sha }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}:latest', steps.repo.outputs.repo) || '' }}
